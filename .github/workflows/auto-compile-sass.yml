name: Auto Compile SASS to CSS

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'assets/sass/**'
  workflow_dispatch: # Memungkinkan Anda menjalankan ulang secara manual dari tombol di web GitHub

permissions:
  contents: write

jobs:
  sass-compiler:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install Sass globally
      run: npm install -g sass

    - name: Verify SASS Folder Structure
      run: |
        echo "=== Memeriksa posisi file SASS ==="
        ls -la assets/sass/ || echo "Folder assets/sass TIDAK DITEMUKAN!"

    - name: Process SASS Compilation
      run: |
        # Menggunakan bendera --load-path agar pustaka Sass dapat melacak berkas @import secara fleksibel
        sass assets/sass/main.scss assets/css/main.css --style expanded --no-source-map --load-path=assets/sass

    - name: Commit and Push Updated CSS
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Pastikan berkas CSS benar-benar ada sebelum dimasukkan ke dalam staging
        if [ -f "assets/css/main.css" ]; then
          git add assets/css/main.css
          
          if ! git diff --cached --quiet; then
            git commit -m "style: auto-compiled SASS changes to main.css [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Tidak ada perbedaan pada main.css yang dihasilkan."
          fi
        else
          echo "Error: Berkas assets/css/main.css gagal dibuat oleh compiler!"
          exit 1
        fi
