name: Compile SASS to CSS

on:
  push:
    branches:
      - main  # Sesuaikan dengan nama branch utama Anda (main atau master)
    paths:
      - 'assets/sass/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-node-version: '18'

    - name: Install SASS Compiler
      run: npm install -g sass

    - name: Compile SASS
      run: sass assets/sass/main.scss assets/css/main.css

    - name: Commit and Push Changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add assets/css/main.css
        git diff-index --quiet HEAD || git commit -m "chore: auto-compile SASS to CSS [skip ci]"
        git push
